[global]
    workgroup = WORKGROUP
    server string = EPGStation recordings
    server role = standalone server
    security = user
    map to guest = Bad User
    guest account = nobody
    server min protocol = SMB2_02
    smb ports = 445
    disable netbios = yes
    load printers = no
    printing = bsd
    printcap name = /dev/null
    disable spoolss = yes
    log level = 1

[Shared]
    path = /shares/Shared
    browseable = yes
    guest ok = yes
    guest only = yes
    read only = no
    # Match EPGStation's default root-owned recordings without changing host permissions.
    force user = root
    create mask = 0664
    directory mask = 0775
    delete readonly = yes
    follow symlinks = no
    wide links = no

[Converted]
    path = /shares/Converted
    browseable = yes
    guest ok = yes
    guest only = yes
    read only = no
    force user = root
    create mask = 0664
    directory mask = 0775
    delete readonly = yes
    follow symlinks = no
    wide links = no
