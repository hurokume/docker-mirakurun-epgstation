# PX-W3PE4 with px4_drv: 0/1 = BS/CS, 2/3 = terrestrial TV.
# recpt1 and arib-b25-stream-test must be installed inside the Mirakurun container.
# For a satellite antenna that needs power from this tuner, add --lnb 15 to
# the BS/CS commands. Leave it out when antenna power is supplied elsewhere.
- name: PX-W3PE4-S1
  types:
    - BS
    - CS
  command: recpt1 --device /dev/px4video0 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: false

- name: PX-W3PE4-S2
  types:
    - BS
    - CS
  command: recpt1 --device /dev/px4video1 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: false

- name: PX-W3PE4-T1
  types:
    - GR
  command: recpt1 --device /dev/px4video2 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: false

- name: PX-W3PE4-T2
  types:
    - GR
  command: recpt1 --device /dev/px4video3 <channel> - -
  decoder: arib-b25-stream-test
  isDisabled: false
